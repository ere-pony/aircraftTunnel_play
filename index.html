<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <!-- 旧安卓 WebView（Chromium<93，国内系统 WebView 常见）缺 ES2022 的 Object.hasOwn：
       @telegram-apps/bridge 解析 tgWebApp* 启动参数时抛 hasOwn is not a function，
       SDK init 失败导致 Telegram 原生全屏通道整体丢失。先于所有脚本 polyfill。 -->
  <script>
    if (!Object.hasOwn) {
      Object.hasOwn = function (obj, prop) {
        return Object.prototype.hasOwnProperty.call(obj, prop);
      };
    }
  </script>

  <!-- Telegram Mini App SDK：官方要求置于 <head> 且先于其它脚本引入，保证打开即
       ready/expand/原生全屏（游戏代码经 body 末尾注入，另行动态补载兜底；非 Telegram
       环境加载后仅为无 initData 的空实例，无副作用）。 -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <title>Cocos Creator | aircraftTunnel</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true,viewport-fit=cover"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <link rel="stylesheet" type="text/css" href="style.f76d1.css"/>

</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
    </div>
  

<!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.5adbf.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.543e6.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.dd1c2.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.7192f.js').catch(function(err) { console.error(err); })
</script>

</body>
</html>
